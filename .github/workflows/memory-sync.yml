name: Memory Sync

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync_memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Create session snapshot
        run: |
          mkdir -p .github/sessions
          echo "Session: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .github/sessions/latest.json
      - name: Commit and push
        run: |
          git add .github/sessions/ || true
          git commit -m "[AUTO] Memory sync" || true
          git push origin main || true